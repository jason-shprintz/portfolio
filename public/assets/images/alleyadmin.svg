<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  width="64"
  height="64"
  role="img"
  aria-label="Alley Admin logo"
>
  <!--
    Bowling pins 1-7 and 10 racked into a letter "A", ball at the apex.
    Pins 8 and 9 are omitted so the outer pins read as the letter's legs;
    the 4/5/6 row stands in for the crossbar.

    Colors are fixed rather than theme-aware on purpose. This is loaded via
    <img>, so an internal prefers-color-scheme block would follow the OS and
    ignore the site's manual theme toggle. These two values hold contrast on
    both the light and dark plate instead.
  -->
  <circle cx="32" cy="10" r="6.5" fill="#c8443c" />

  <g fill="#0e7c77">
    <circle cx="32" cy="23.5" r="4" />
    <circle cx="24" cy="34.5" r="4" />
    <circle cx="40" cy="34.5" r="4" />
    <circle cx="16" cy="45.5" r="4" />
    <circle cx="32" cy="45.5" r="4" />
    <circle cx="48" cy="45.5" r="4" />
    <circle cx="8" cy="56.5" r="4" />
    <circle cx="56" cy="56.5" r="4" />
  </g>
</svg>
